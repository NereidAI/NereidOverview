# Vendored render of upstream kustomize (air-gapped):
#   intel-device-plugins-for-kubernetes v0.36.0,
#   deployments/gpu_plugin/overlays/monitoring_shared-dev_nfd
# Suite deltas vs upstream overlay: image keeps its public upstream
# coordinate (air-gapped resolution goes through the containerd Harbor
# mirror per deploy-standards §15.3); shared-dev-num=10
# (suite standard, each physical GPU is sliceable into 10 shared devices);
# balanced allocation spreads independent containers across physical GPUs;
# namespace pinned to kube-system (upstream base has none).
# Node selection relies on the NFD label intel.feature.node.kubernetes.io/gpu=true.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: intel-gpu-plugin
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      containers:
      - args:
        - -shared-dev-num=10
        - -allocation-policy=balanced
        - -enable-monitoring
        - -v=2
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        # Public upstream coordinate; air-gapped nodes resolve it through the
        # containerd Harbor mirror (see deploy/prereqs/images.txt).
        image: docker.io/intel/intel-gpu-plugin:0.36.0
        imagePullPolicy: IfNotPresent
        name: intel-gpu-plugin
        resources:
          limits:
            cpu: 100m
            memory: 90Mi
          requests:
            cpu: 40m
            memory: 45Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seLinuxOptions:
            type: container_device_plugin_t
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /dev/dri
          name: devfs
          readOnly: true
        - mountPath: /sys/class/drm
          name: sysfsdrm
          readOnly: true
        - mountPath: /var/lib/kubelet/device-plugins
          name: kubeletsockets
        - mountPath: /var/run/cdi
          name: cdipath
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
        kubernetes.io/arch: amd64
      volumes:
      - hostPath:
          path: /dev/dri
        name: devfs
      - hostPath:
          path: /sys/class/drm
        name: sysfsdrm
      - hostPath:
          path: /var/lib/kubelet/device-plugins
        name: kubeletsockets
      - hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
        name: cdipath
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
